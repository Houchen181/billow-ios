# XcodeGen spec — the .xcodeproj is generated from this (CI runs `xcodegen generate`).
# Change the bundle ID / link domain here before the first App Store Connect upload.
name: Billow
options:
  bundleIdPrefix: com.houchenli
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Domain that hosts apple-app-site-association + the Plaid OAuth redirect page (site/ folder).
    BILLOW_LINK_DOMAIN: billow-app.pages.dev
packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm
    majorVersion: 7.0.0
targets:
  Billow:
    type: application
    platform: iOS
    sources:
      - path: Billow
    dependencies:
      - package: LinkKit
        product: LinkKit
    # CI writes Config/Signing.generated.xcconfig (team, cert, profile) before
    # archiving; locally the include is optional and Xcode signs automatically.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houchenli.billow
        PRODUCT_NAME: Billow
        INFOPLIST_FILE: Billow/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Billow/Billow.entitlements
        # XcodeGen's iOS preset hard-codes "iPhone Developer" at target level,
        # which outranks xcconfig files; route it through a variable instead.
        CODE_SIGN_IDENTITY: $(BILLOW_CODE_SIGN_IDENTITY)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
schemes:
  Billow:
    build:
      targets:
        Billow: all
    run:
      config: Debug
    archive:
      config: Release
