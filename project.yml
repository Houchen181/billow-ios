# XcodeGen spec — the .xcodeproj is generated from this (CI runs `xcodegen generate`).
# Change the bundle ID / link domain here before the first App Store Connect upload.
name: Charges
options:
  bundleIdPrefix: com.houchenli
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Domain that hosts apple-app-site-association + the Plaid OAuth redirect page (site/ folder).
    CHARGES_LINK_DOMAIN: charges-hl.pages.dev
packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm
    majorVersion: 7.0.0
targets:
  Charges:
    type: application
    platform: iOS
    sources:
      - path: Charges
    dependencies:
      - package: LinkKit
        product: LinkKit
    # CI writes Config/Signing.generated.xcconfig (team, cert, profile) before
    # archiving; locally the include is optional and Xcode signs automatically.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houchenli.charges
        PRODUCT_NAME: Charges
        INFOPLIST_FILE: Charges/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Charges/Charges.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
schemes:
  Charges:
    build:
      targets:
        Charges: all
    run:
      config: Debug
    archive:
      config: Release
